{% extends 'base.html' %}

{% block title %}Zadania{% endblock %}

{% block section_header %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom border-secondary">
    <h1 class="h2">Lista zadań</h1>
    <a href="{% url 'new_task' %}" class="btn btn-success btn-sm">Nowe zadanie</a>
</div>
{% endblock %}

{% block content %}
<div data-bs-theme="dark">
    
        <table id="tasksTable" class="table table-dark table-borderless table-hover w-100">
        <thead>
            <tr>
                <th scope="col">Nazwa</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
                <tr>
                    <td><a href="{% url 'task_details' pk=task.id %}">{{ task.name }}</a></td>
                </tr>
            {% endfor %}
        </tbody>
        </table>

</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        $('#tasksTable').DataTable({
            responsive: true,
            // Tłumaczenie interfejsu na język polski:
            language: {
                search: "Szukaj:",
                lengthMenu: "Pokaż _MENU_ pozycji",
                info: "Pozycje od _START_ do _END_ z _TOTAL_ łącznie",
                infoEmpty: "Pozycji 0 z 0 dostępnych",
                infoFiltered: "(filtrowanie spośród _MAX_ dostępnych pozycji)",
                zeroRecords: "Nie znaleziono pasujących pozycji",
                emptyTable: "Brak danych w tabeli",
                paginate: {
                    first: "Pierwsza",
                    previous: "Poprzednia",
                    next: "Następna",
                    last: "Ostatnia"
                }
            }
        });
    });
</script>
{% endblock %}
